services:
    zero2prod-axum:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8000:8000"
        stop_grace_period: 30s
        environment:
            - APP_DATABASE__USERNAME=postgres
            - APP_DATABASE__PASSWORD=password
            - APP_DATABASE__DATABASE_NAME=newsletter
            - APP_DATABASE__HOST=postgres
            - APP_DATABASE__PORT=5432
            - APP_DATABASE__REQUIRE_SSL=false
            - APP_APPLICATION__PORT=8000
            - APP_APPLICATION__HOST=0.0.0.0
            - APP_APPLICATION__BASE_URL=http://127.0.0.1 # 바꿔야 함
    postgres:
        image: postgres:18
        ports:
            - "5432:5432"
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: newsletter
        volumes:
            - postgres_data:/var/lib/postgresql

volumes:
    postgres_data:

networks:
    default:
        name: zero2prod-axum-network
