[package]
name = "zero2prod_axum"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod_axum"

[dependencies]
anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
config = "0.15"
cookie = { version = "0.18", features = ["percent-encode"] }
entities = { path = "./entities" }
hex = "0.4"
hmac = "0.12"
htmlescape = "0.3"
password-hash = "0.5"
rand = "0.9"
reqwest = { version = "0.12", features = ["cookies", "json", "rustls-tls"] }
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde-aux = "4.7"
sha3 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "request-id", "trace"] }
tower-sessions = { version = "0.14", features = ["private", "signed"] }
tower-sessions-moka-store = "0.15"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
tracing = { version = "0.1", features = ["log"] }
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = [
    "registry",
    "env-filter",
    "json",
] }
unicode-segmentation = "1.12"
urlencoding = "2.1"
uuid = { version = "1.17", features = ["v4"] }
validator = "0.20"

[dev-dependencies]
migration = { path = "./migration" }
claim = "0.5"
fake = "4.4"
quickcheck = "1.0"
quickcheck_macros = "1.1"
wiremock = "0.6"
serde_json = "1.0"
linkify = "0.10"
reqwest_cookie_store = "0.9"
